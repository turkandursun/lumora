name: mindful_journal
description: "Profesyonel, gizlilik odaklı AI destekli journaling uygulaması"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Backend / Auth / Realtime
  supabase_flutter: ^2.5.6

  # Local storage (offline-first journal yazımı)
  drift: ^2.21.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Şifreleme (client-side encryption)
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # UI / UX
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  fl_chart: ^0.68.0   # duygu-durum trend grafikleri için
  google_fonts: ^6.2.1
  lottie: ^3.1.2

  # Ambient sound (looping rain for the "sad" mood) + voice journal playback
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

  # Spoken meditation guidance (text-to-speech)
  flutter_tts: ^4.0.2

  # Photos for daily activity entries
  image_picker: ^1.1.2

  # Voice journal entry recording
  record: ^7.1.1

  # Yardımcı
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqlite3: ^2.4.6

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/rain_loop.mp3
    - assets/animations/walking_person.json
    - assets/images/home_bg_calm.png
    - assets/images/home_bg_happy.png
    - assets/images/home_bg_tired.png
    - assets/images/home_bg_sad.png
    - assets/images/home_bg_anxious.png
    - assets/images/signup_background.png
    - assets/images/onboarding_bg_1.png
    - assets/images/onboarding_bg_2.png
    - assets/images/onboarding_bg_3.png
    - assets/images/onboarding_bg_4.png
    - assets/images/astra_light.png
    - assets/images/astra_dark.png
    - assets/images/astra_light_plain.png
    - assets/images/astra_dark_plain.png
